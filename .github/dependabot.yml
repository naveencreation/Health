version: 2
updates:
  # Maintain npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10

    # Supply-chain security: wait 7 days after package release to protect against zero-day malicious/hijacked packages
    cooldown:
      default-days: 7

    # Group updates to reduce PR noise
    groups:
      dev-dependencies:
        patterns:
          - '*'
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

      production-dependencies:
        patterns:
          - '*'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

    # Commit message formatting
    commit-message:
      prefix: 'chore(deps)'

    # Prevent major breaking version bumps on core Expo SDK components
    # (Expo manages react, react-native, and core expo libraries via SDK versions)
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native-reanimated'
        update-types: ['version-update:semver-major']

  # Maintain GitHub Actions workflows (CI / CD)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'UTC'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(ci)'
    open-pull-requests-limit: 5
